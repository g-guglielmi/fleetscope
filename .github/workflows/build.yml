name: build-image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sign check manifest
        # FS_SIGNING_KEY: repo secret with the Ed25519 private key from
        # `tools/sign/sign.py keygen`. Without it the manifest is built unsigned
        # and agents will refuse it (fine for a preview, not for production).
        env:
          FS_SIGNING_KEY: ${{ secrets.FS_SIGNING_KEY }}
        run: |
          pip install --quiet cryptography
          if [ -n "$FS_SIGNING_KEY" ]; then
            python tools/sign/sign.py manifest --checks-dir checks --out checks/manifest.json
          else
            echo "::warning::FS_SIGNING_KEY secret not set - building an UNSIGNED check manifest"
            python tools/sign/sign.py manifest --checks-dir checks --out checks/manifest.json --unsigned
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/app
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
